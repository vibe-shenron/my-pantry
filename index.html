<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7">
<title>My Pantry</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Pantry">
<meta name="description" content="Household inventory: stock by location, an automatic shopping list and expiry warnings.">
<style>
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --ink: #1C1C1E; --muted: #6E6E73; --faint: #AEAEB2;
    --line: rgba(60,60,67,.16); --fill: rgba(120,120,128,.12); --bar: rgba(242,242,247,.88);
    --accent: #0A8F63; --accent-soft: rgba(10,143,99,.12); --on-accent: #FFFFFF;
    --low: #B25F00; --out: #D0302F;
    --scrim: rgba(0,0,0,.38); --shadow: 0 8px 30px rgba(0,0,0,.16);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1C1C1E; --ink: #F2F2F7; --muted: #98989F; --faint: #636366;
      --line: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --bar: rgba(12,12,13,.86);
      --accent: #30D158; --accent-soft: rgba(48,209,88,.16); --on-accent: #06210F;
      --low: #FFB340; --out: #FF6961;
      --scrim: rgba(0,0,0,.6); --shadow: 0 8px 30px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1C1C1E; --ink: #F2F2F7; --muted: #98989F; --faint: #636366;
    --line: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --bar: rgba(12,12,13,.86);
    --accent: #30D158; --accent-soft: rgba(48,209,88,.16); --on-accent: #06210F;
    --low: #FFB340; --out: #FF6961;
    --scrim: rgba(0,0,0,.6); --shadow: 0 8px 30px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.35 var(--font); -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
  button:disabled { cursor: default; opacity: .5; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .ic { width: 20px; height: 20px; flex: none; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100dvh; padding: 0 16px calc(100px + env(safe-area-inset-bottom)); }

  /* top bar + titles */
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; margin: 0 -16px; padding: calc(8px + env(safe-area-inset-top)) 16px 8px; background: var(--bar); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
  .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .status.pending i { background: var(--low); }
  .status.bad i { background: var(--out); }
  .tb-btn { color: var(--accent); display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; }
  .tb-btn .ic { width: 26px; height: 26px; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: .005em; margin: 2px 0 12px; text-wrap: balance; overflow-wrap: anywhere; }

  /* search + segments */
  .search { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px; border-radius: 11px; background: var(--fill); color: var(--muted); }
  .search .ic { width: 18px; height: 18px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 17px; color: var(--ink); }
  .seg { display: flex; gap: 2px; overflow-x: auto; margin: 12px 0 4px; padding: 2px; border-radius: 10px; background: var(--fill); scrollbar-width: none; }
  .seg::-webkit-scrollbar, .emojis::-webkit-scrollbar { display: none; }
  .seg button { flex: 1 0 auto; padding: 6px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .seg button.edit { color: var(--accent); flex-grow: 0; }

  /* banners */
  .banner { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--card); }
  .banner .ic { color: var(--low); }
  .banner.bad .ic { color: var(--out); }
  .banner.info .ic { color: var(--accent); }
  .banner b { font-weight: 600; }
  .banner small { display: block; color: var(--muted); font-size: 13px; }
  .banner .go { margin-left: auto; color: var(--accent); font-size: 15px; font-weight: 600; white-space: nowrap; }

  /* grouped lists */
  .group-h { display: flex; justify-content: space-between; gap: 12px; margin: 24px 16px 7px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .group { background: var(--card); border-radius: 12px; overflow: hidden; }
  .foot { margin: 8px 16px 0; font-size: 13px; color: var(--muted); }
  .row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 12px 8px 14px; cursor: pointer; }
  .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 62px; border-top: .5px solid var(--line); }
  .row.plain { min-height: 48px; }
  .row.plain + .row::before, .row + .row.plain::before { left: 16px; }
  .row.static { cursor: default; }
  .row.faded { opacity: .55; cursor: default; }
  .tile { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--fill); font-size: 20px; flex: none; }
  .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { font-size: 13px; color: var(--muted); }
  .s.low { color: var(--low); } .s.out { color: var(--out); }
  .val { color: var(--muted); margin-left: auto; white-space: nowrap; text-align: right; }
  .chev { color: var(--faint); width: 16px; height: 16px; }
  .accent-t { color: var(--accent); }
  .danger-t { color: var(--out); }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .pill { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 3px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

  /* steppers */
  .mini-step { display: flex; align-items: center; gap: 2px; flex: none; }
  .mini-step button { width: 32px; height: 32px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--accent); }
  .mini-step button:active { transform: scale(.9); }
  .mini-step .ic { width: 16px; height: 16px; stroke-width: 2.6; }
  .mini-step b { min-width: 68px; text-align: center; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }

  /* shopping */
  .circle { width: 24px; height: 24px; border-radius: 50%; border: 1.8px solid var(--faint); display: grid; place-items: center; flex: none; color: var(--on-accent); transition: .15s; }
  .done .circle { background: var(--accent); border-color: var(--accent); }
  .done .t { color: var(--muted); text-decoration: line-through; }
  .circle .ic { width: 14px; height: 14px; stroke-width: 3.2; }
  .row input.inline { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--ink); height: 40px; }
  .x-btn { color: var(--faint); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; flex: none; }
  .x-btn .ic { width: 16px; height: 16px; }
  .toolbar { position: sticky; bottom: calc(66px + env(safe-area-inset-bottom)); margin: 20px 0 0; }
  .pbtn { width: 100%; height: 50px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 17px; text-align: center; }
  .pbtn:disabled { background: var(--fill); color: var(--muted); opacity: 1; }

  /* switch */
  .switch { width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; flex: none; transition: .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: .2s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 22px; }

  /* welcome */
  .welcome { padding-top: calc(40px + env(safe-area-inset-top)); }
  .logo-tile { width: 84px; height: 84px; border-radius: 22px; background: var(--card); display: grid; place-items: center; font-size: 46px; box-shadow: var(--shadow); }
  .welcome h1 { margin: 20px 0 6px; }
  .lede { margin: 0; color: var(--muted); font-size: 17px; max-width: 34ch; }

  /* tabs */
  .tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bar); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); border-top: .5px solid var(--line); padding: 6px 0 calc(4px + env(safe-area-inset-bottom)); z-index: 10; }
  .tabs button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 500; color: var(--faint); padding-bottom: 2px; }
  .tabs .ic { width: 26px; height: 26px; }
  .tabs button.active { color: var(--accent); }
  .badge { position: absolute; top: -2px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--out); color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }
  .dot { position: absolute; top: 0; left: calc(50% + 10px); width: 9px; height: 9px; border-radius: 50%; background: var(--low); }

  /* sheet */
  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 480px; height: 92dvh; overflow-y: auto; overscroll-behavior: contain; transform: translate(-50%, 102%); visibility: hidden; transition: transform .34s cubic-bezier(.2,.8,.2,1), visibility 0s .34s; background: var(--bg); border-radius: 12px 12px 0 0; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); z-index: 21; }
  .sheet.open { transform: translate(-50%, 0); visibility: visible; transition: transform .34s cubic-bezier(.2,.8,.2,1); }
  .sheet-bar { position: sticky; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 0 -16px; padding: 14px 16px; background: var(--bg); z-index: 1; }
  .sheet-bar b { font-weight: 600; font-size: 17px; text-align: center; }
  .sheet-bar button { color: var(--accent); font-size: 17px; justify-self: start; }
  .sheet-bar button.end { justify-self: end; font-weight: 600; }
  .ident { text-align: center; margin: 8px 0 4px; }
  .ident .big { width: 76px; height: 76px; margin: 0 auto 8px; border-radius: 20px; background: var(--card); display: grid; place-items: center; font-size: 42px; }
  .ident h2 { font-size: 24px; margin: 0; overflow-wrap: anywhere; }
  .ident p { margin: 2px 0 0; }
  .qty-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; }
  .qty-row .mini-step button { width: 42px; height: 42px; }
  .qty-row .mini-step b { font-size: 20px; min-width: 96px; }
  .notes { padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* forms */
  .form-row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; position: relative; }
  .form-row + .form-row::before, .emojis + .form-row::before { content: ""; position: absolute; top: 0; right: 0; left: 14px; border-top: .5px solid var(--line); }
  .form-row label { flex: none; width: 104px; }
  .form-row input, .form-row select { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--ink); text-align: right; height: 46px; }
  .form-row input:focus-visible, .form-row select:focus-visible { outline: none; color: var(--accent); }
  .form-row select { direction: rtl; }
  .form-row select option { direction: ltr; }
  textarea.area { display: block; width: 100%; min-height: 88px; border: 0; outline: 0; background: none; padding: 12px 14px; font-size: 16px; resize: vertical; }
  textarea.code { font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; min-height: 160px; }
  .emojis { display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px; scrollbar-width: none; }
  .emojis button { flex: none; width: 42px; height: 42px; border-radius: 10px; font-size: 22px; text-align: center; }
  .emojis button.on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .loc-row input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; height: 44px; }
  select.bare { border: 0; outline: 0; background: none; color: var(--muted); font-size: 16px; text-align: right; max-width: 45%; }
  .qty-row > button { font-size: 15px; }

  /* dialog */
  .dialog-wrap { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; background: var(--scrim); }
  .dialog { width: 100%; max-width: 300px; background: var(--card); border-radius: 16px; overflow: hidden; text-align: center; box-shadow: var(--shadow); }
  .dialog .body { padding: 20px 18px 16px; }
  .dialog h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  .dialog p { margin: 0; font-size: 14px; color: var(--muted); }
  .dialog input { margin-top: 14px; width: 100%; height: 40px; border-radius: 9px; border: .5px solid var(--line); background: var(--bg); padding: 0 10px; font-size: 16px; text-align: center; }
  .dialog .btns { display: grid; grid-template-columns: 1fr 1fr; border-top: .5px solid var(--line); }
  .dialog .btns button { height: 46px; color: var(--accent); font-size: 17px; text-align: center; }
  .dialog .btns button + button { border-left: .5px solid var(--line); font-weight: 600; }
  .dialog .btns button.danger { color: var(--out); }

  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -20px); max-width: calc(100% - 32px); background: var(--card); color: var(--ink); padding: 10px 16px; border-radius: 22px; box-shadow: var(--shadow); font-size: 14px; font-weight: 600; opacity: 0; transition: .25s; z-index: 50; pointer-events: none; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <section class="screen" id="welcome" hidden></section>

  <section class="screen" id="inventory" hidden>
    <div class="topbar"><span class="status-slot"></span><button class="tb-btn" data-act="add" aria-label="Add item"><i data-icon="plus"></i></button></div>
    <h1 id="inv-title">My Pantry</h1>
    <label class="search"><i data-icon="search"></i><input id="q" type="search" placeholder="Search items" autocomplete="off" aria-label="Search items"></label>
    <div class="seg" id="seg"></div>
    <div id="inv-list"></div>
  </section>

  <section class="screen" id="shopping" hidden>
    <div class="topbar"><span class="status-slot"></span><span></span></div>
    <h1>Shopping</h1>
    <div id="shop-list"></div>
    <div class="toolbar"><button class="pbtn" id="restock" data-act="restock"></button></div>
  </section>

  <section class="screen" id="sync" hidden>
    <div class="topbar"><span class="status-slot"></span><span></span></div>
    <h1>Sync</h1>
    <div id="sync-body"></div>
  </section>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="inventory" class="active"><i data-icon="list"></i>Inventory</button>
  <button data-tab="shopping"><i data-icon="cart"></i>Shopping<b class="badge" id="shop-badge" hidden></b></button>
  <button data-tab="sync"><i data-icon="sync"></i>Sync<i class="dot" id="sync-dot" hidden></i></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
<div class="dialog-wrap" id="dialog" hidden><div class="dialog" role="alertdialog" aria-modal="true" id="dialog-body"></div></div>
<input type="file" id="file-in" accept=".json,application/json,text/plain" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   My Pantry: single-file build.
   Local-first: every change is an event in a log kept on this phone.
   Phones sync by exchanging the log (a .json file) and merging it.
   ===================================================================== */

const APP = 'my-pantry';
const FORMAT = 1;
const DAY = 864e5;
const UNITS = ['pcs', 'pack', 'bottle', 'tin', 'can', 'jar', 'bag', 'box', 'roll', 'tube', 'kg', 'g', 'L', 'ml'];
const PLAIN = ['kg', 'g', 'L', 'ml', 'pcs'];
const DEFAULT_LOCS = [['pantry', 'Pantry', '🥫'], ['fridge', 'Fridge', '🧊'], ['freezer', 'Freezer', '❄️'], ['bathroom', 'Bathroom', '🛁'], ['cleaning', 'Cleaning', '🧽']];
const LOC_ICONS = ['🥫', '🧊', '❄️', '🛁', '🧽', '🍳', '🧺', '🚗', '🛏️', '🧸', '🐾', '💊', '📦'];
const OTHER = { id: '_other', name: 'Other', icon: '📦' };
const EDITABLE = ['name', 'emoji', 'loc', 'cat', 'unit', 'min', 'exp', 'notes'];
const EMOJIS = ['📦', '🍚', '🍝', '🥫', '🫒', '🌾', '🍞', '🥐', '🥣', '🍵', '☕', '🧃', '🥤', '🍷', '🥛', '🥚', '🧀', '🧈', '🍨', '🍎', '🍌', '🍊', '🍋', '🍇', '🍓', '🥑', '🍅', '🥔', '🥕', '🧅', '🧄', '🥬', '🥦', '🌶️', '🍗', '🥩', '🐟', '🍤', '🥜', '🍯', '🧂', '🍫', '🍪', '🧻', '🪥', '🧴', '🧼', '🧽', '🧺', '🗑️', '🧹', '🪣', '💡', '🔋', '💊', '🩹', '🐾'];
// Checked in order, so specific words come before words they contain ("toilet" before "oil").
const GUESS = [
  ['toilet', '🧻'], ['kitchen roll', '🧻'], ['tissue', '🧻'], ['toothpaste', '🪥'], ['toothbrush', '🪥'], ['peanut', '🥜'], ['chickpea', '🥫'], ['ice cream', '🍨'],
  ['juice', '🧃'], ['steak', '🥩'], ['milk', '🥛'], ['egg', '🥚'], ['cheese', '🧀'], ['cheddar', '🧀'], ['butter', '🧈'], ['yogurt', '🥣'],
  ['yoghurt', '🥣'], ['cereal', '🥣'], ['oat', '🥣'], ['bread', '🍞'], ['croissant', '🥐'], ['rice', '🍚'], ['pasta', '🍝'], ['spaghetti', '🍝'],
  ['noodle', '🍝'], ['flour', '🌾'], ['oil', '🫒'], ['tea', '🍵'], ['coffee', '☕'], ['soda', '🥤'], ['cola', '🥤'], ['water', '🥤'], ['wine', '🍷'],
  ['apple', '🍎'], ['banana', '🍌'], ['orange', '🍊'], ['lemon', '🍋'], ['grape', '🍇'], ['strawberr', '🍓'], ['avocado', '🥑'], ['tomato', '🍅'],
  ['potato', '🥔'], ['carrot', '🥕'], ['onion', '🧅'], ['garlic', '🧄'], ['spinach', '🥬'], ['lettuce', '🥬'], ['broccoli', '🥦'], ['pea', '🥦'],
  ['chilli', '🌶️'], ['chili', '🌶️'], ['pepper', '🌶️'], ['chicken', '🍗'], ['beef', '🥩'], ['mince', '🥩'], ['lamb', '🥩'], ['meat', '🥩'],
  ['fish', '🐟'], ['salmon', '🐟'], ['tuna', '🐟'], ['prawn', '🍤'], ['shrimp', '🍤'], ['nut', '🥜'], ['honey', '🍯'], ['salt', '🧂'],
  ['sugar', '🧂'], ['spice', '🧂'], ['chocolate', '🍫'], ['biscuit', '🍪'], ['cookie', '🍪'], ['shampoo', '🧴'], ['conditioner', '🧴'],
  ['lotion', '🧴'], ['soap', '🧼'], ['sponge', '🧽'], ['laundry', '🧺'], ['detergent', '🧺'], ['bin bag', '🗑️'], ['trash', '🗑️'],
  ['bleach', '🪣'], ['cleaner', '🪣'], ['bulb', '💡'], ['batter', '🔋'], ['paracetamol', '💊'], ['ibuprofen', '💊'], ['medicine', '💊'],
  ['vitamin', '💊'], ['plaster', '🩹'], ['bandage', '🩹'], ['dog', '🐾'], ['cat food', '🐾'], ['tin', '🥫'], ['bean', '🥫'], ['soup', '🥫'],
];
// name, emoji, location, category, qty, unit, warn below, expires in (days)
const EXAMPLES = [

/* ---------- storage: IndexedDB, else localStorage, else memory only ---------- */
const Store = (() => {
  const PREFIX = 'my-pantry:';
  const mem = {};
  let mode = 'memory';
  let idb = null;
  let queue = Promise.resolve();
  const api = { failed: false, get mode() { return mode; } };

  api.open = async () => {
    try {
      idb = await Promise.race([
        new Promise((res, rej) => {
          const r = indexedDB.open(APP, 1);
          r.onupgradeneeded = () => r.result.createObjectStore('kv');
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
          r.onblocked = () => rej(new Error('blocked'));
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000)),
      ]);
      mode = 'idb';
      return mode;
    } catch (e) { idb = null; }
    try {
      localStorage.setItem(PREFIX + 'probe', '1');
      localStorage.removeItem(PREFIX + 'probe');
      mode = 'local';
    } catch (e) { mode = 'memory'; }
    return mode;
  };

  api.get = async (key) => {
    try {
      if (mode === 'idb') {
        return await new Promise((res, rej) => {
          const r = idb.transaction('kv').objectStore('kv').get(key);
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      }
      if (mode === 'local') {
        const v = localStorage.getItem(PREFIX + key);
        return v == null ? undefined : JSON.parse(v);
      }
    } catch (e) { console.warn('My Pantry: read failed', e); }
    return mem[key];
  };

  // Writes run one at a time, in order.
  api.put = (key, value) => {
    queue = queue.then(async () => {
      if (mode === 'idb') {
        await new Promise((res, rej) => {
          const tx = idb.transaction('kv', 'readwrite');
          if (value === undefined) tx.objectStore('kv').delete(key); else tx.objectStore('kv').put(value, key);
          tx.oncomplete = res;
          tx.onerror = () => rej(tx.error);
          tx.onabort = () => rej(tx.error);
        });
      } else if (mode === 'local') {
        if (value === undefined) localStorage.removeItem(PREFIX + key);
        else localStorage.setItem(PREFIX + key, JSON.stringify(value));
      } else {
        mem[key] = value;
      }
      if (api.failed) { api.failed = false; render(); }
    }).catch((e) => {
      console.error('My Pantry: save failed', e);
      api.failed = true;
      render();
    });
    return queue;
  };
  return api;
})();

/* ---------- the event log ---------- */
let meta = null;        // this phone only: id, counter, last send/backup
let log = [];           // every event, sorted
let seen = new Set();   // event ids in the log
let S = emptyState();   // current state, rebuilt from the log

function newMeta() {
  return { deviceId: uid(), n: 0, lastSentAt: 0, lastBackupAt: 0, lastImport: null, persisted: false };
}
function emptyState() {
  return { pantryId: null, name: 'My Pantry', main: null, devices: {}, locs: [], items: {}, extras: {}, ticks: {}, soonDays: 7, clock: 0 };
}
const order = (a, b) => a.t - b.t || (a.dev < b.dev ? -1 : a.dev > b.dev ? 1 : a.n - b.n);

function touch(it, e) { it.changed = e.t; it.by = e.dev; }
function clearTickIfStocked(s, it) { if (it.qty > 0 && it.qty >= it.min) delete s.ticks['i:' + it.id]; }

function apply(s, e) {
  const d = e.d || {};
  s.clock = Math.max(s.clock, e.t);
  const dv = s.devices[e.dev] || (s.devices[e.dev] = { id: e.dev, name: 'A phone', last: 0 });
  dv.last = Math.max(dv.last, e.t);
  const it = d.id != null ? s.items[d.id] : null;
  switch (e.type) {
    case 'pantry.create':
      if (!s.pantryId) { s.pantryId = d.pantryId; s.main = e.dev; if (d.name) s.name = String(d.name); }
      break;
    case 'pantry.main': if (d.dev) s.main = d.dev; break;
    case 'pantry.set':
      if (d.soonDays > 0) s.soonDays = +d.soonDays;
      if (d.name) s.name = String(d.name);
      break;
    case 'device.name': if (d.name) dv.name = String(d.name); break;
    case 'loc.add':
      if (!s.locs.some((l) => l.id === d.id)) s.locs.push({ id: d.id, name: String(d.name || 'Location'), icon: d.icon || '📦', deleted: false });
      break;
    case 'loc.edit': {
      const l = s.locs.find((x) => x.id === d.id);
      if (l) { if (d.name) l.name = String(d.name); if (d.icon) l.icon = d.icon; }
      break;
    }
    case 'loc.del': {
      const l = s.locs.find((x) => x.id === d.id);
      if (l) l.deleted = true;
      break;
    }
    case 'item.add':
      if (!it) {
        s.items[d.id] = {
          id: d.id, name: String(d.name || 'Item'), emoji: d.emoji || '📦', loc: d.loc, cat: d.cat || '',
          qty: round(Math.max(0, +d.qty || 0)), unit: d.unit || 'pcs', min: Math.max(0, +d.min || 0), exp: d.exp || null,
          notes: d.notes || '', example: !!d.example, deleted: null, purged: false, created: e.t, changed: e.t, by: e.dev,
        };
      }
      break;
    case 'item.edit':
      if (it) {
        for (const k of EDITABLE) if (k in d) it[k] = k === 'min' ? Math.max(0, +d[k] || 0) : d[k];
        touch(it, e);
        clearTickIfStocked(s, it);
      }
      break;
    case 'item.adj':
      if (it) { it.qty = round(Math.max(0, it.qty + (+d.delta || 0))); touch(it, e); clearTickIfStocked(s, it); }
      break;
    case 'item.set':
      if (it) { it.qty = round(Math.max(0, +d.qty || 0)); touch(it, e); clearTickIfStocked(s, it); }
      break;
    case 'item.del':
      if (it) { it.deleted = e.t; it.purged = !!d.purge; touch(it, e); delete s.ticks['i:' + it.id]; }
      break;
    case 'item.restore':
      if (it) { it.deleted = null; it.purged = false; touch(it, e); }
      break;
    case 'shop.add':
      s.extras[d.id] = { id: d.id, name: String(d.name || 'Item'), emoji: d.emoji || '🛒', note: d.note || '', t: e.t };
      break;
    case 'shop.del':
      delete s.extras[d.id];
      delete s.ticks['x:' + d.id];
      break;
    case 'shop.tick':
      if (d.on) s.ticks[d.key] = true; else delete s.ticks[d.key];
      break;
  }
}

function rebuild() {
  S = emptyState();
  for (const e of log) apply(S, e);
}

// Record a change made on this phone. Call commit() after one or more emits.
function emit(type, d) {
  meta.n += 1;
  const e = { id: meta.deviceId + '.' + meta.n, dev: meta.deviceId, n: meta.n, t: Math.max(Date.now(), S.clock + 1), type, d };
  log.push(e);
  seen.add(e.id);
  apply(S, e);
  return e;
}
function persist() { return Store.put('data', { meta, log }); }
function commit() { persist(); render(); }

function validEvent(e) {
  return !!e && typeof e === 'object' && typeof e.id === 'string' && typeof e.dev === 'string' && typeof e.type === 'string'
    && Number.isFinite(e.t) && Number.isFinite(e.n) && (e.d == null || typeof e.d === 'object');
}
// Add events from another phone. Same events always give the same result, in any order.
function merge(events) {
  let added = 0;
  for (const e of events) {
    if (!validEvent(e) || seen.has(e.id)) continue;
    log.push(e);
    seen.add(e.id);
    added++;
  }
  if (added) { log.sort(order); rebuild(); }
  return added;
}

/* ---------- reading the state ---------- */
const items = () => Object.values(S.items).filter((i) => !i.deleted);
const deletedItems = () => Object.values(S.items).filter((i) => i.deleted && !i.purged && Date.now() - i.deleted < 30 * DAY);
const activeLocs = () => S.locs.filter((l) => !l.deleted);
const locOf = (i) => S.locs.find((l) => l.id === i.loc && !l.deleted) || OTHER;
const status = (i) => (i.qty <= 0 ? 'out' : i.qty < i.min ? 'low' : 'ok');
const stepOf = (i) => (i.unit === 'kg' || i.unit === 'L' ? 0.5 : i.unit === 'g' || i.unit === 'ml' ? 100 : 1);
const unitText = (unit, q) => (PLAIN.includes(unit) || q === 1 ? unit : unit === 'box' ? 'boxes' : unit + 's');
const fmtQty = (i, q = i.qty) => `${round(q)} ${unitText(i.unit, round(q))}`;
const suggest = (i) => round(Math.max(i.min * 2 - i.qty, stepOf(i)));
function daysLeft(i) {
  if (!i.exp) return null;
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const d = new Date(i.exp + 'T00:00');
  return isNaN(d) ? null : Math.round((d - t0) / DAY);
}
const expiring = (i) => { const d = daysLeft(i); return d !== null && d <= S.soonDays; };
function expiryLabel(i) {
  const d = daysLeft(i);
  if (d === null) return '';
  if (d < 0) return d === -1 ? 'Expired yesterday' : `Expired ${-d} days ago`;
  if (d === 0) return 'Expires today';
  if (d === 1) return 'Expires tomorrow';
  if (d <= 14) return `Expires in ${d} days`;
  return 'Expires ' + new Date(i.exp + 'T00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}
function ago(t) {
  if (!t) return 'never';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} h ago`;
  const dd = Math.round(h / 24);
  if (dd === 1) return 'yesterday';
  if (dd < 7) return `${dd} days ago`;
  return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
const nameOf = (dev) => (S.devices[dev] ? S.devices[dev].name : 'A phone');
const myName = () => nameOf(meta.deviceId);
const isMain = () => S.main === meta.deviceId;
const otherDevices = () => Object.values(S.devices).filter((d) => d.id !== meta.deviceId);
const pendingCount = () => log.filter((e) => e.dev === meta.deviceId && e.t > meta.lastSentAt).length;

function syncStatus() {
  if (Store.mode === 'memory' || Store.failed) return ['bad', 'Not saving on this phone'];
  if (otherDevices().length) {
    const p = pendingCount();
    if (p) return ['pending', `${p} change${p === 1 ? '' : 's'} not sent yet`];
    return ['', meta.lastSentAt ? `All changes sent · ${ago(meta.lastSentAt)}` : 'All changes sent'];
  }
  if (!meta.lastBackupAt) return ['pending', 'Only on this phone · no backup yet'];
  if (Date.now() - meta.lastBackupAt > 7 * DAY) return ['pending', `Last backup ${ago(meta.lastBackupAt)}`];
  return ['', `Backed up ${ago(meta.lastBackupAt)}`];
}

function describe(e) {
  const d = e.d || {};
  const it = d.id != null ? S.items[d.id] : null;
  const nm = it ? it.name : 'an item';
  switch (e.type) {
    case 'pantry.create': return 'Started this pantry';
    case 'pantry.main': return `${nameOf(d.dev)} became the main phone`;
    case 'pantry.set': return 'Changed pantry settings';
    case 'device.name': return `Named a phone “${d.name}”`;
    case 'loc.add': return `Added location ${d.name}`;
    case 'loc.edit': return d.name ? `Renamed a location to ${d.name}` : 'Changed a location icon';
    case 'loc.del': return 'Removed a location';
    case 'item.add': return d.example ? `Added example item ${d.name}` : `Added ${d.name}`;
    case 'item.edit': return `Edited ${nm}`;
    case 'item.adj': {
      const q = Math.abs(+d.delta || 0);
      const f = it ? fmtQty(it, q) : q;
      if (d.why === 'restock') return `Restocked ${f} ${nm}`;
      return `${d.delta < 0 ? 'Used' : 'Added'} ${f} ${nm}`;
    }
    case 'item.set': return `Counted ${nm}: ${it ? fmtQty(it, +d.qty || 0) : d.qty}`;
    case 'item.del': return d.purge ? `Removed example ${nm}` : `Deleted ${nm}`;
    case 'item.restore': return `Restored ${nm}`;
    case 'shop.add': return `Added ${d.name} to the shopping list`;
    case 'shop.del': return d.bought ? `Bought ${d.name}` : `Took ${d.name} off the shopping list`;
    default: return null;
  }
}

function createPantry(phoneName, withExamples) {
  emit('pantry.create', { pantryId: uid() + uid(), name: 'My Pantry' });
  emit('device.name', { name: phoneName });
  for (const [id, name, ic] of DEFAULT_LOCS) emit('loc.add', { id, name, icon: ic });
  if (withExamples) {
    for (const [name, emoji, loc, cat, qty, unit, min, exp] of EXAMPLES) {
      emit('item.add', { id: uid(), name, emoji, loc, cat, qty, unit, min, exp: exp == null ? null : dateStr(new Date(Date.now() + exp * DAY)), notes: '', example: true });
    }
  }
  commit();
  askPersist();
}

async function askPersist() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      meta.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
      persist();
      render();
    }
  } catch (e) { /* not available here */ }
}

/* ---------- files: send, back up, receive ---------- */
function exportText() {
  return JSON.stringify({
    app: APP, format: FORMAT, pantryId: S.pantryId, pantryName: S.name,
    from: { dev: meta.deviceId, name: myName() }, exportedAt: Date.now(), events: log,
  });
}
const fileName = (kind) => `my-pantry-${kind}-${slug(myName())}-${dateStr(new Date())}.json`;

let downloadsP = null;
function downloadsCap() {
  if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve(null);
  if (!downloadsP) downloadsP = window.claude.use('downloads').catch(() => null);
  return downloadsP;
}

// Hand the viewer a file. Returns true when it was saved or shared.
async function saveFile(name, text, kind) {
  const dl = await downloadsCap();
  if (dl) {
    try { await dl.save({ filename: name, data: text }); return true; } catch (err) {
      const code = err && err.code;
      if (code === 'declined') { toast('Not saved'); return false; }
      if (code === 'rate_limited') { toast('Confirm the save that’s already open'); return false; }
    }
  }
  if (!window.claude) {
    if (kind === 'sync' && navigator.canShare) {
      try {
        const f = new File([text], name, { type: 'application/json' });
        if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'My Pantry' }); return true; }
      } catch (err) { if (err && err.name === 'AbortError') return false; }
    }
    try {
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.append(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
      return true;
    } catch (err) { /* fall through to copying */ }
  }
  openSheet('copy', { text, kind });
  return false;
}

function importText(text, joinName) {
  const notOurs = { ok: false, msg: 'That isn’t a My Pantry file. Choose the .json file sent from your other phone.' };
  let data;
  try { data = JSON.parse(text); } catch (e) { return notOurs; }
  if (!data || data.app !== APP || !Array.isArray(data.events)) return notOurs;
  if (data.format > FORMAT) return { ok: false, msg: 'This file comes from a newer version of My Pantry. Update the app on this phone first.' };
  const joining = !S.pantryId;
  if (!joining && data.pantryId !== S.pantryId) {
    return { ok: false, msg: `This file belongs to a different pantry (“${data.pantryName || 'unnamed'}”). Nothing was changed.` };
  }
  const who = data.from && data.from.name ? String(data.from.name) : 'the other phone';
  const added = merge(data.events);
  if (joining) {
    if (!S.pantryId) { log = []; seen = new Set(); rebuild(); return { ok: false, msg: 'This file has no pantry in it. Nothing was changed.' }; }
    emit('device.name', { name: joinName || 'Second Phone' });
  }
  meta.lastImport = { from: who, at: Date.now() };
  commit();
  if (joining) { askPersist(); return { ok: true, msg: `Joined. ${items().length} items copied from ${who}.` }; }
  return { ok: true, msg: added ? `Got ${added} change${added === 1 ? '' : 's'} from ${who}` : `Already up to date with ${who}` };
}

/* ---------- inventory ---------- */
function subline(i) {
  const st = status(i);
  if (st === 'out') return ['out', 'Out of stock'];
  if (expiring(i)) return [daysLeft(i) <= 1 ? 'out' : 'low', expiryLabel(i)];
  if (st === 'low') return ['low', `Low · warn below ${fmtQty(i, i.min)}`];
  return ['', i.cat || locOf(i).name];
}

function itemRow(i) {
  const [cls, text] = subline(i);
  const id = esc(i.id);
  return `
    <div class="row" data-act="open" data-id="${id}">
      <span class="tile">${esc(i.emoji)}</span>
      <span class="grow"><span class="t">${esc(i.name)}</span><span class="s ${cls}">${esc(text)}</span></span>
      <span class="mini-step">
        <button data-act="adj" data-dir="-1" data-id="${id}" aria-label="Use one ${esc(i.name)}">${icon('minus')}</button>
        <b>${esc(fmtQty(i))}</b>
        <button data-act="adj" data-dir="1" data-id="${id}" aria-label="Add one ${esc(i.name)}">${icon('plus')}</button>
      </span>
    </div>`;
}

function renderInventory() {
  $('#inv-title').textContent = S.name || 'My Pantry';
  const locs = activeLocs();
  if (ui.loc !== 'all' && !locs.some((l) => l.id === ui.loc)) ui.loc = 'all';
  const seg = (id, label) => `<button data-act="loc" data-id="${esc(id)}" class="${ui.loc === id ? 'on' : ''}">${esc(label)}</button>`;
  $('#seg').innerHTML = seg('all', 'All') + locs.map((l) => seg(l.id, l.name)).join('') + '<button class="edit" data-act="locs">Edit</button>';

  const all = items();
  const q = ui.q.trim().toLowerCase();
  const needs = (i) => status(i) !== 'ok' || expiring(i);
  const list = all.filter((i) =>
    (ui.loc === 'all' || i.loc === ui.loc) &&
    (!q || i.name.toLowerCase().includes(q) || String(i.cat).toLowerCase().includes(q)) &&
    (!ui.attention || needs(i)));

  let html = '';
  if (Store.mode === 'memory' || Store.failed) {
    html += `<div class="banner bad">${icon('alert')}<span class="grow"><b>This browser isn’t saving My Pantry</b><small>Changes will be lost when you close it. Open the app in Chrome, not in a private tab.</small></span></div>`;
  }
  if (all.some((i) => i.example)) {
    html += `<div class="banner info">${icon('info')}<span class="grow"><b>These are example items</b><small>Try the buttons, then remove them.</small></span><button class="go" data-act="remove-examples">Remove</button></div>`;
  }
  if (!q) {
    const n = all.filter(needs).length;
    if (ui.attention) {
      html += `<button class="banner" data-act="attention"><span class="grow"><b>Showing ${list.length} that need attention</b></span><span class="go">Show all</span></button>`;
    } else if (n) {
      const lo = all.filter((i) => status(i) !== 'ok').length;
      const ex = all.filter(expiring).length;
      html += `<button class="banner" data-act="attention">${icon('alert')}<span class="grow"><b>${n} need${n === 1 ? 's' : ''} attention</b><small>${lo} low or out · ${ex} expiring soon</small></span><span class="go">Show</span></button>`;
    }
  }
  const groups = [...locs, OTHER]
    .map((l) => ({ l, rows: list.filter((i) => locOf(i).id === l.id).sort(byName) }))
    .filter((g) => g.rows.length);
  html += groups.map(({ l, rows }) => `
    <div class="group-h"><span>${esc(l.name)}</span><span>${rows.length}</span></div>
    <div class="group">${rows.map(itemRow).join('')}</div>`).join('');
  if (!all.length) {
    html += '<div class="group-h"></div><div class="group"><p class="empty">No items yet.<br>Tap <b>+</b> at the top to add your first one.</p></div>';
  } else if (!groups.length) {
    html += '<div class="group-h"></div><div class="group"><p class="empty">No items match.</p></div>';
  }
  $('#inv-list').innerHTML = html;
}

/* ---------- shopping ---------- */
function shoppingList() {
  const auto = items().filter((i) => status(i) !== 'ok').sort(byName).map((i) => ({
    key: 'i:' + i.id, name: i.name, emoji: i.emoji, item: i,
    note: `Buy ${fmtQty(i, suggest(i))} · have ${fmtQty(i)}`, checked: !!S.ticks['i:' + i.id],
  }));
  const extras = Object.values(S.extras).sort((a, b) => a.t - b.t).map((x) => ({
    key: 'x:' + x.id, id: x.id, name: x.name, emoji: x.emoji, note: x.note || 'Added by you', checked: !!S.ticks['x:' + x.id],
  }));
  return { auto, extras };
}

function shopRow(e) {
  return `
    <div class="row ${e.checked ? 'done' : ''}" data-act="tick" data-key="${esc(e.key)}" role="checkbox" aria-checked="${e.checked}" tabindex="0">
      <span class="circle">${e.checked ? icon('check') : ''}</span>
      <span class="grow"><span class="t">${esc(e.emoji)} ${esc(e.name)}</span><span class="s">${esc(e.note)}</span></span>
      ${e.id ? `<button class="x-btn" data-act="del-extra" data-id="${esc(e.id)}" aria-label="Remove ${esc(e.name)}">${icon('x')}</button>` : ''}
    </div>`;
}

function renderShop() {
  const { auto, extras } = shoppingList();
  const n = auto.filter((e) => e.checked).length + extras.filter((e) => e.checked).length;
  const typed = document.activeElement && document.activeElement.id === 'extra' ? document.activeElement.value : '';
  $('#shop-list').innerHTML = `
    <div class="group-h"><span>Running low</span><span>${auto.length}</span></div>
    <div class="group">${auto.map(shopRow).join('') || '<p class="empty">Nothing is running low</p>'}</div>
    <p class="foot">Added by itself when an item drops below its warning level. Restocking adds the amount shown.</p>
    <div class="group-h"><span>Extras</span><span>${extras.length}</span></div>
    <div class="group">
      ${extras.map(shopRow).join('')}
      <form class="row static" id="extra-form">
        <span class="circle" style="border-style:dashed"></span>
        <input class="inline" id="extra" placeholder="Add something else" autocomplete="off" enterkeyhint="done" maxlength="60" aria-label="Add something to the shopping list">
      </form>
    </div>`;
  if (typed) { const x = $('#extra'); x.value = typed; x.focus(); }
  const btn = $('#restock');
  btn.disabled = !n;
  btn.textContent = n ? `Restock ${n} item${n === 1 ? '' : 's'}` : 'Tick items as you shop';
  const total = auto.length + extras.length;
  $('#shop-badge').textContent = total;
  $('#shop-badge').hidden = !total;
}

/* ---------- sync + settings ---------- */
function renderSync() {
  const me = S.devices[meta.deviceId];
  const others = otherDevices();
  const pend = pendingCount();
  const storage = Store.mode === 'memory' || Store.failed ? 'Not saving' : meta.persisted ? 'Saved · protected' : 'Saved on this phone';
  const sendNote = others.length && pend ? `${pend} change${pend === 1 ? '' : 's'} not sent yet`
    : meta.lastSentAt ? 'Last sent ' + ago(meta.lastSentAt) : 'Makes a file to share by WhatsApp or Quick Share';
  const recvNote = meta.lastImport ? `Last received from ${meta.lastImport.from}, ${ago(meta.lastImport.at)}` : 'Open a file sent from your other phone';
  const phones = [me, ...others].filter(Boolean).map((d) => `
    <div class="row static"><span class="tile">📱</span>
      <span class="grow"><span class="t">${esc(d.name)}${d.id === meta.deviceId ? ' (this phone)' : ''}</span>
      <span class="s">${d.id === meta.deviceId ? 'Last change ' + ago(d.last) : 'Newest change received: ' + ago(d.last)}</span></span>
      ${d.id === S.main ? '<span class="pill">Main</span>' : ''}
    </div>`).join('');
  const soon = [3, 5, 7, 14, 30].map((n) => `<option value="${n}"${n === S.soonDays ? ' selected' : ''}>${n} days</option>`).join('');

  $('#sync-body').innerHTML = `
    <div class="group-h">This phone</div>
    <div class="group">
      <button class="row plain" data-act="rename-phone"><span class="grow">Name</span><span class="val">${esc(myName())}</span>${chev()}</button>
      <div class="row plain static"><span class="grow">Role</span><span class="val">${isMain() ? 'Main phone' : 'Member'}</span></div>
      <div class="row plain static"><span class="grow">Storage</span><span class="val">${storage}</span></div>
    </div>
    ${meta.persisted ? '' : '<p class="foot">Add My Pantry to your home screen (Chrome menu ⋮ → Add to Home screen) so the browser keeps its data safe.</p>'}

    <div class="group-h">Sync with another phone</div>
    <div class="group">
      <button class="row" data-act="send"><span class="tile accent-t">${icon('upload')}</span><span class="grow"><span class="t">Send to another phone</span><span class="s">${esc(sendNote)}</span></span>${chev()}</button>
      <button class="row" data-act="receive"><span class="tile accent-t">${icon('download')}</span><span class="grow"><span class="t">Receive from another phone</span><span class="s">${esc(recvNote)}</span></span>${chev()}</button>
    </div>
    <p class="foot">Send from one phone, then receive it on the other. Do it both ways and the phones match. If both phones changed something, the changes are combined, so nothing is lost.</p>

    <div class="group-h">Phones in this pantry</div>
    <div class="group">
      ${phones}
      ${isMain() ? '' : '<button class="row plain" data-act="make-main"><span class="grow accent-t">Make this the main phone</span></button>'}
    </div>
    ${others.length ? '' : '<p class="foot">To add your second phone: open My Pantry on it and choose <b>Join from another phone</b>. Then tap <b>Send to another phone</b> here.</p>'}

    <div class="group-h">Backup</div>
    <div class="group">
      <button class="row plain" data-act="backup"><span class="grow accent-t">Save a backup file</span><span class="val">${meta.lastBackupAt ? ago(meta.lastBackupAt) : 'Never'}</span></button>
      <button class="row plain" data-act="receive"><span class="grow accent-t">Restore from a backup file</span></button>
    </div>
    <p class="foot">Restoring adds anything in the file that this phone doesn’t have. It never deletes anything.</p>

    <div class="group-h">Pantry</div>
    <div class="group">
      <button class="row plain" data-act="locs"><span class="grow">Locations</span><span class="val">${activeLocs().length}</span>${chev()}</button>
      <div class="row plain static"><label class="grow" for="soon-days">“Use soon” means within</label><select id="soon-days" class="bare">${soon}</select></div>
      <button class="row plain" data-act="activity"><span class="grow">Activity</span>${chev()}</button>
      <button class="row plain" data-act="deleted"><span class="grow">Recently deleted</span><span class="val">${deletedItems().length}</span>${chev()}</button>
    </div>

    <div class="group-h">Coming later</div>
    <div class="group">
      <div class="row plain faded"><span class="grow"><span class="t">Automatic sync</span><span class="s">Phones sync by themselves once the app has its own web address (GitHub)</span></span></div>
      <div class="row plain faded"><span class="grow"><span class="t">Barcode scanning</span><span class="s">Add and find items with the camera</span></span></div>
    </div>

    <div class="group-h"></div>
    <div class="group">
      ${items().some((i) => i.example) ? '<button class="row plain" data-act="remove-examples"><span class="grow danger-t">Remove example items</span></button>' : ''}
      <button class="row plain" data-act="erase"><span class="grow danger-t">Erase My Pantry from this phone</span></button>
    </div>
    <p class="foot">My Pantry keeps your data on your phones. Nothing is uploaded.</p>`;
}

/* =====================================================================
   Sheets, dialog, toast
   ===================================================================== */
// Sheets holding text fields are only drawn when opened, so a background refresh never wipes what's typed.
const FORM_SHEETS = ['item', 'receive', 'copy', 'locs'];

function openSheet(kind, arg) {
  ui.sheet = { kind, arg };
  ui.form = null;
  renderSheet(true);
  $('#sheet').classList.add('open');
  $('#scrim').classList.add('open');
  $('#sheet').scrollTop = 0;
}
function closeSheet() {
  ui.sheet = null;
  ui.form = null;
  $('#sheet').classList.remove('open');
  $('#scrim').classList.remove('open');
}
function renderSheet(first) {
  const sh = ui.sheet;
  if (!sh || (!first && FORM_SHEETS.includes(sh.kind))) return;
  const html = {
    detail: sheetDetail, item: sheetItem, locs: sheetLocs, activity: sheetActivity,
    deleted: sheetDeleted, receive: sheetReceive, copy: sheetCopy,
  }[sh.kind](sh.arg);
  if (ui.sheet) $('#sheet-body').innerHTML = html;
}
const sheetBar = (title, left, right) =>
  `<div class="sheet-bar">${left || '<span></span>'}<b>${esc(title)}</b>${right || '<span></span>'}</div>`;
const doneBtn = '<button class="end" data-act="close">Done</button>';

function sheetDetail(id) {
  const i = S.items[id];
  if (!i || i.deleted) { closeSheet(); return ''; }
  const [cls, text] = subline(i);
  const l = locOf(i);
  const eid = esc(i.id);
  const hist = log.filter((e) => e.d && e.d.id === id && e.type.startsWith('item.')).slice(-6).reverse();
  const exp = i.exp ? new Date(i.exp + 'T00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : 'None';
  return sheetBar('Item', '', doneBtn) + `
    <div class="ident"><div class="big">${esc(i.emoji)}</div><h2>${esc(i.name)}</h2><p class="s ${cls}">${esc(text)}</p></div>
    <div class="group-h">Quantity</div>
    <div class="group"><div class="qty-row">
      <button class="accent-t" data-act="set-count" data-id="${eid}">Set count…</button>
      <span class="mini-step">
        <button data-act="adj" data-dir="-1" data-id="${eid}" aria-label="Use one">${icon('minus')}</button>
        <b>${esc(fmtQty(i))}</b>
        <button data-act="adj" data-dir="1" data-id="${eid}" aria-label="Add one">${icon('plus')}</button>
      </span>
    </div></div>
    <div class="group-h">Details</div>
    <div class="group">
      <div class="row plain static"><span class="grow">Location</span><span class="val">${esc(l.icon)} ${esc(l.name)}</span></div>
      <div class="row plain static"><span class="grow">Category</span><span class="val">${esc(i.cat || '—')}</span></div>
      <div class="row plain static"><span class="grow">Warn below</span><span class="val">${i.min > 0 ? esc(fmtQty(i, i.min)) : 'Never'}</span></div>
      <div class="row plain static"><span class="grow">Expires</span><span class="val">${esc(exp)}</span></div>
    </div>
    ${i.notes ? `<div class="group-h">Notes</div><div class="group"><div class="notes">${esc(i.notes)}</div></div>` : ''}
    <div class="group-h">History</div>
    <div class="group">${hist.map((e) => `
      <div class="row plain static"><span class="grow"><span class="t">${esc(describe(e))}</span><span class="s">${esc(nameOf(e.dev))} · ${ago(e.t)}</span></span></div>`).join('')}</div>
    <div class="group-h"></div>
    <div class="group">
      <button class="row plain" data-act="edit" data-id="${eid}"><span class="grow accent-t">Edit item</span></button>
      <button class="row plain" data-act="to-list" data-id="${eid}"><span class="grow accent-t">Add to shopping list</span></button>
      <button class="row plain" data-act="delete" data-id="${eid}"><span class="grow danger-t">Delete item</span></button>
    </div>`;
}

function emojiButtons() {
  const list = EMOJIS.includes(ui.form.emoji) ? EMOJIS : [ui.form.emoji, ...EMOJIS];
  return list.map((e) => `<button type="button" data-act="emoji" data-e="${esc(e)}" class="${e === ui.form.emoji ? 'on' : ''}" aria-label="Icon ${esc(e)}">${esc(e)}</button>`).join('');
}

function sheetItem(id) {
  const i = id ? S.items[id] : null;
  if (!ui.form) ui.form = { emoji: i ? i.emoji : '📦', picked: !!i };
  const locs = activeLocs();
  const locSel = i ? i.loc : ui.loc !== 'all' ? ui.loc : locs[0] && locs[0].id;
  const cats = [...new Set(items().map((x) => x.cat).filter(Boolean))].sort();
  const units = i && !UNITS.includes(i.unit) ? [...UNITS, i.unit] : UNITS;
  const unitSel = i ? i.unit : 'pcs';
  return `<form id="item-form" data-id="${i ? esc(i.id) : ''}" novalidate>
    ${sheetBar(i ? 'Edit Item' : 'New Item', '<button type="button" data-act="close">Cancel</button>', `<button class="end" type="submit">${i ? 'Save' : 'Add'}</button>`)}
    <div class="group-h">Item</div>
    <div class="group">
      <div class="form-row"><label for="f-name">Name</label><input id="f-name" name="name" maxlength="60" autocomplete="off" placeholder="Required" value="${i ? esc(i.name) : ''}"></div>
      <div class="emojis" id="f-emojis">${emojiButtons()}</div>
      <div class="form-row"><label for="f-cat">Category</label><input id="f-cat" name="cat" list="f-cats" maxlength="40" autocomplete="off" placeholder="Optional" value="${esc(i ? i.cat : '')}"><datalist id="f-cats">${cats.map((c) => `<option value="${esc(c)}"></option>`).join('')}</datalist></div>
    </div>
    <div class="group-h">Stock</div>
    <div class="group">
      <div class="form-row"><label for="f-loc">Location</label><select id="f-loc" name="loc">${locs.map((l) => `<option value="${esc(l.id)}"${l.id === locSel ? ' selected' : ''}>${esc(l.name)}</option>`).join('')}</select></div>
      <div class="form-row"><label for="f-qty">Quantity</label><input id="f-qty" name="qty" type="number" min="0" step="any" inputmode="decimal" value="${i ? round(i.qty) : 1}"></div>
      <div class="form-row"><label for="f-unit">Unit</label><select id="f-unit" name="unit">${units.map((u) => `<option${u === unitSel ? ' selected' : ''}>${esc(u)}</option>`).join('')}</select></div>
      <div class="form-row"><label for="f-min">Warn below</label><input id="f-min" name="min" type="number" min="0" step="any" inputmode="decimal" value="${i ? i.min : 1}"></div>
      <div class="form-row"><label for="f-exp">Expires</label><input id="f-exp" name="exp" type="date" value="${i && i.exp ? esc(i.exp) : ''}"></div>
    </div>
    <p class="foot">When the quantity drops below the warning level, the item goes on the shopping list. Set it to 0 to never warn.</p>
    <div class="group-h">Notes</div>
    <div class="group"><textarea class="area" id="f-notes" name="notes" maxlength="500" placeholder="Brand, size, where to buy…">${esc(i ? i.notes : '')}</textarea></div>
  </form>`;
}

function sheetLocs() {
  const locs = activeLocs();
  return sheetBar('Locations', '', doneBtn) + `
    <div class="group-h">Where things are kept</div>
    <div class="group">
      ${locs.map((l) => {
        const n = items().filter((i) => i.loc === l.id).length;
        return `<div class="row static loc-row">
          <button class="tile" data-act="loc-icon" data-id="${esc(l.id)}" aria-label="Change icon for ${esc(l.name)}">${esc(l.icon)}</button>
          <input data-loc-name="${esc(l.id)}" value="${esc(l.name)}" maxlength="30" aria-label="Location name">
          <span class="s">${n} item${n === 1 ? '' : 's'}</span>
          <button class="x-btn" data-act="loc-del" data-id="${esc(l.id)}" aria-label="Remove ${esc(l.name)}">${icon('trash')}</button>
        </div>`;
      }).join('')}
      <button class="row plain" data-act="loc-add"><span class="grow accent-t">Add a location</span></button>
    </div>
    <p class="foot">Tap a name to rename it, or an icon to change it. A location has to be empty before you can remove it.</p>`;
}

function sheetActivity() {
  const rows = [];
  for (let k = log.length - 1; k >= 0 && rows.length < 200; k--) {
    const text = describe(log[k]);
    if (text) rows.push(`<div class="row plain static"><span class="grow"><span class="t">${esc(text)}</span><span class="s">${esc(nameOf(log[k].dev))} · ${ago(log[k].t)}</span></span></div>`);
  }
  return sheetBar('Activity', '', doneBtn) + `
    <div class="group-h">Newest first</div>
    <div class="group">${rows.join('') || '<p class="empty">Nothing yet</p>'}</div>`;
}

function sheetDeleted() {
  const list = deletedItems().sort((a, b) => b.deleted - a.deleted);
  return sheetBar('Recently Deleted', '', doneBtn) + `
    <div class="group-h">Last 30 days</div>
    <div class="group">${list.map((i) => `
      <div class="row static"><span class="tile">${esc(i.emoji)}</span>
        <span class="grow"><span class="t">${esc(i.name)}</span><span class="s">Deleted ${ago(i.deleted)} on ${esc(nameOf(i.by))}</span></span>
        <button class="accent-t" data-act="restore" data-id="${esc(i.id)}">Restore</button></div>`).join('') || '<p class="empty">Nothing deleted recently</p>'}</div>`;
}

function sheetReceive() {
  const joining = !S.pantryId;
  return sheetBar(joining ? 'Join a Pantry' : 'Receive', '<button data-act="close">Cancel</button>', '') + `
    <div class="group-h">${joining ? 'From your main phone' : 'From another phone, or a backup'}</div>
    <div class="group">
      <button class="row" data-act="pick-file"><span class="tile accent-t">${icon('download')}</span>
        <span class="grow"><span class="t accent-t">Choose the file</span><span class="s">The .json file from WhatsApp, Quick Share or email. Save it to this phone first.</span></span></button>
    </div>
    <p class="foot">${joining
      ? 'On your main phone, open the Sync tab and tap <b>Send to another phone</b>. Send that file to this phone, then choose it here.'
      : 'Nothing on this phone is deleted. Only changes it doesn’t have yet are added.'}</p>
    <div class="group-h">Or paste the text</div>
    <div class="group"><textarea class="area code" id="paste-in" placeholder="Paste copied My Pantry text here" spellcheck="false" autocomplete="off"></textarea></div>
    <div style="margin-top:12px"><button class="pbtn" data-act="paste-load">Load pasted text</button></div>`;
}

function sheetCopy(arg) {
  return sheetBar('Copy Instead', '', doneBtn) + `
    <p class="foot" style="margin-top:4px">Files can’t be saved here, so copy this text instead. ${arg.kind === 'sync'
      ? 'Paste it into a WhatsApp message to your other phone. There, open Sync → Receive and paste it.'
      : 'Paste it into a note or a message to yourself, and keep it somewhere safe.'}</p>
    <div class="group" style="margin-top:12px"><textarea class="area code" id="copy-out" readonly spellcheck="false">${esc(arg.text)}</textarea></div>
    <div style="margin-top:12px"><button class="pbtn" data-act="copy-text">Copy text</button></div>`;
}

/* ---------- dialog (in place of confirm/prompt, which can be blocked) ---------- */
let dialogResolve = null;
function ask({ title, text = '', input = null, ok = 'OK', cancel = 'Cancel', danger = false }) {
  if (dialogResolve) closeDialog(false);
  return new Promise((resolve) => {
    dialogResolve = resolve;
    const field = input
      ? `<input id="dlg-in" type="${input.type === 'number' ? 'number' : 'text'}"${input.type === 'number' ? ' inputmode="decimal" step="any" min="0"' : ' maxlength="30"'} value="${esc(input.value == null ? '' : input.value)}" aria-label="${esc(title)}">`
      : '';
    $('#dialog-body').innerHTML = `
      <div class="body"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${field}</div>
      <div class="btns"><button data-act="dlg-cancel">${esc(cancel)}</button><button data-act="dlg-ok" class="${danger ? 'danger' : ''}">${esc(ok)}</button></div>`;
    $('#dialog').hidden = false;
    const inp = $('#dlg-in');
    if (inp) { inp.focus(); inp.select(); } else $('[data-act="dlg-ok"]').focus();
  });
}
function closeDialog(ok) {
  const inp = $('#dlg-in');
  const value = ok ? (inp ? inp.value : true) : null;
  $('#dialog').hidden = true;
  $('#dialog-body').innerHTML = '';
  const r = dialogResolve;
  dialogResolve = null;
  if (r) r(value);
}

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800 + String(msg).length * 35);
}

/* =====================================================================
   Actions
   ===================================================================== */
function restock() {
  const { auto, extras } = shoppingList();
  let n = 0;
  for (const e of auto) {
    if (!e.checked) continue;
    emit('item.adj', { id: e.item.id, delta: suggest(e.item), why: 'restock' });
    emit('shop.tick', { key: e.key, on: false });
    n++;
  }
  for (const e of extras) {
    if (!e.checked) continue;
    emit('shop.del', { id: e.id, name: e.name, bought: true });
    n++;
  }
  commit();
  toast(`${n} item${n === 1 ? '' : 's'} restocked`);
}

function markSent(kind) {
  const now = Math.max(Date.now(), S.clock);
  meta.lastBackupAt = now;
  if (kind === 'sync') meta.lastSentAt = now;
  persist();
  render();
}

async function sendFile(kind) {
  const ok = await saveFile(fileName(kind), exportText(), kind);
  if (!ok) return;
  markSent(kind);
  toast(kind === 'sync' ? 'Sync file ready. Send it to your other phone, then tap Receive there.' : 'Backup saved');
}

function handleImport(text) {
  if (!String(text || '').trim()) { toast('Paste the text first'); return; }
  const res = importText(text, ui.joinName);
  if (res.ok) { closeSheet(); ui.tab = 'inventory'; render(); }
  toast(res.msg);
}

async function copyText(kind) {
  const ta = $('#copy-out');
  let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {
    try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (e2) { ok = false; }
  }
  if (ok) { markSent(kind); toast('Copied'); } else { ta.focus(); ta.select(); toast('Press and hold the text, then tap Copy'); }
}

function saveItem(form) {
  const id = form.dataset.id;
  const f = new FormData(form);
  const name = String(f.get('name') || '').trim();
  if (!name) { toast('Give the item a name'); $('#f-name').focus(); return; }
  const data = {
    name, emoji: ui.form.emoji, loc: f.get('loc') || (activeLocs()[0] || OTHER).id,
    cat: String(f.get('cat') || '').trim(), unit: f.get('unit') || 'pcs',
    min: Math.max(0, +f.get('min') || 0), exp: f.get('exp') || null, notes: String(f.get('notes') || '').trim(),
  };
  const qty = round(Math.max(0, +f.get('qty') || 0));
  if (id) {
    const i = S.items[id];
    if (!i) { closeSheet(); return; }
    const changed = {};
    for (const k of EDITABLE) if ((i[k] == null ? '' : i[k]) !== (data[k] == null ? '' : data[k])) changed[k] = data[k];
    if (Object.keys(changed).length) emit('item.edit', { id, ...changed });
    if (qty !== i.qty) emit('item.set', { id, qty });
    commit();
    openSheet('detail', id);
    toast('Saved');
  } else {
    emit('item.add', { id: uid(), ...data, qty });
    commit();
    closeSheet();
    ui.attention = false;
    ui.q = '';
    $('#q').value = '';
    if (ui.loc !== 'all') ui.loc = data.loc;
    ui.tab = 'inventory';
    render();
    toast(`Added ${name}`);
  }
}

async function eraseAll() {
  closeSheet();
  meta = newMeta();
  log = [];
  seen = new Set();
  S = emptyState();
  Object.assign(ui, { tab: 'inventory', loc: 'all', attention: false, q: '' });
  $('#q').value = '';
  $('#welcome').innerHTML = '';
  await persist();
  render();
  scrollTo(0, 0);
  toast('My Pantry was erased from this phone');
}

async function onAction(act, el) {
  const id = el.dataset.id;
  const item = id != null ? S.items[id] : null;
  switch (act) {
    case 'toggle-examples': {
      ui.examples = !ui.examples;
      $('#w-examples').classList.toggle('on', ui.examples);
      el.setAttribute('aria-checked', String(ui.examples));
      return;
    }
    case 'start':
      createPantry($('#w-name').value.trim() || 'Main Phone', ui.examples);
      return toast('Your pantry is ready');
    case 'join':
      ui.joinName = $('#w-name').value.trim() || 'Second Phone';
      return openSheet('receive');
    case 'goto-sync': ui.tab = 'sync'; closeSheet(); render(); return scrollTo(0, 0);
    case 'add': return openSheet('item', null);
    case 'open': return openSheet('detail', id);
    case 'adj': {
      if (!item) return;
      const dir = +el.dataset.dir;
      if (dir < 0 && item.qty <= 0) return;
      emit('item.adj', { id, delta: round(dir * Math.min(stepOf(item), dir < 0 ? item.qty : Infinity)) });
      return commit();
    }
    case 'loc': ui.loc = id; return renderInventory();
    case 'locs': return openSheet('locs');
    case 'attention': ui.attention = !ui.attention; return renderInventory();
    case 'remove-examples': {
      const ex = items().filter((i) => i.example);
      const yes = await ask({ title: 'Remove example items?', text: `${ex.length} example item${ex.length === 1 ? '' : 's'} will be removed. Items you added stay.`, ok: 'Remove', danger: true });
      if (!yes) return;
      for (const i of ex) emit('item.del', { id: i.id, purge: true });
      commit();
      return toast('Examples removed');
    }
    case 'tick': emit('shop.tick', { key: el.dataset.key, on: !S.ticks[el.dataset.key] }); return commit();
    case 'del-extra': {
      const x = S.extras[id];
      if (x) { emit('shop.del', { id, name: x.name }); commit(); }
      return;
    }
    case 'restock': return restock();
    case 'send': return sendFile('sync');
    case 'backup': return sendFile('backup');
    case 'receive': return openSheet('receive');
    case 'pick-file': return $('#file-in').click();
    case 'paste-load': return handleImport($('#paste-in').value);
    case 'copy-text': return copyText(ui.sheet && ui.sheet.arg.kind);
    case 'rename-phone': {
      const v = await ask({ title: 'Name this phone', text: 'Shown on your other phones.', input: { value: myName() }, ok: 'Save' });
      if (v && v.trim() && v.trim() !== myName()) { emit('device.name', { name: v.trim() }); commit(); }
      return;
    }
    case 'make-main': {
      const yes = await ask({ title: 'Make this the main phone?', text: 'Do this if your main phone is lost or replaced. The change reaches other phones the next time you sync.', ok: 'Make Main' });
      if (yes) { emit('pantry.main', { dev: meta.deviceId }); commit(); toast('This is now the main phone'); }
      return;
    }
    case 'activity': return openSheet('activity');
    case 'deleted': return openSheet('deleted');
    case 'restore':
      if (item) { emit('item.restore', { id }); commit(); toast(`${item.name} restored`); }
      return;
    case 'erase': {
      const yes = await ask({ title: 'Erase from this phone?', text: 'Everything on this phone is removed. Other phones keep their copy. Save a backup first if this is your only phone.', ok: 'Erase', danger: true });
      if (yes) eraseAll();
      return;
    }
    case 'close': return closeSheet();
    case 'set-count': {
      if (!item) return;
      const v = await ask({ title: `How many ${unitText(item.unit, 2)} of ${item.name}?`, text: 'Replaces the current count.', input: { type: 'number', value: round(item.qty) }, ok: 'Set' });
      if (v == null || v === '' || isNaN(+v)) return;
      const qty = round(Math.max(0, +v));
      if (qty !== item.qty) { emit('item.set', { id, qty }); commit(); }
      return;
    }
    case 'edit': return openSheet('item', id);
    case 'to-list':
      if (item) { emit('shop.add', { id: uid(), name: item.name, emoji: item.emoji }); commit(); toast('Added to the shopping list'); }
      return;
    case 'delete': {
      if (!item) return;
      const yes = await ask({ title: `Delete ${item.name}?`, text: 'You can restore it from Sync → Recently deleted for 30 days.', ok: 'Delete', danger: true });
      if (!yes) return;
      emit('item.del', { id });
      closeSheet();
      commit();
      return toast(`${item.name} deleted`);
    }
    case 'emoji':
      ui.form.emoji = el.dataset.e;
      ui.form.picked = true;
      $('#f-emojis').innerHTML = emojiButtons();
      return;
    case 'loc-icon': {
      const l = S.locs.find((x) => x.id === id);
      if (!l) return;
      emit('loc.edit', { id, icon: LOC_ICONS[(LOC_ICONS.indexOf(l.icon) + 1) % LOC_ICONS.length] });
      commit();
      return renderSheet(true);
    }
    case 'loc-del': {
      const l = S.locs.find((x) => x.id === id);
      if (!l) return;
      const n = items().filter((i) => i.loc === id).length;
      if (n) return toast(`Move or delete the ${n} item${n === 1 ? '' : 's'} in ${l.name} first`);
      const yes = await ask({ title: `Remove ${l.name}?`, ok: 'Remove', danger: true });
      if (!yes) return;
      emit('loc.del', { id });
      commit();
      return renderSheet(true);
    }
    case 'loc-add': {
      emit('loc.add', { id: uid(), name: 'New location', icon: '📦' });
      commit();
      renderSheet(true);
      const inputs = document.querySelectorAll('[data-loc-name]');
      const last = inputs[inputs.length - 1];
      if (last) { last.focus(); last.select(); }
      return;
    }
    case 'dlg-ok': return closeDialog(true);
    case 'dlg-cancel': return closeDialog(false);
  }
}

/* ---------- wiring ---------- */
document.addEventListener('click', (ev) => {
  if (ev.target.id === 'scrim') return closeSheet();
  if (ev.target.id === 'dialog') return closeDialog(false);
  const tab = ev.target.closest('[data-tab]');
  if (tab) {
    ui.tab = tab.dataset.tab;
    closeSheet();
    render();
    return scrollTo(0, 0);
  }
  const el = ev.target.closest('[data-act]');
  if (el) onAction(el.dataset.act, el);
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') {
    if (!$('#dialog').hidden) return closeDialog(false);
    if (ui.sheet) return closeSheet();
  }
  if (ev.key === 'Enter' && ev.target.id === 'dlg-in') { ev.preventDefault(); return closeDialog(true); }
  const role = ev.target.getAttribute && ev.target.getAttribute('role');
  if ((ev.key === 'Enter' || ev.key === ' ') && (role === 'switch' || role === 'checkbox') && ev.target.dataset.act) {
    ev.preventDefault();
    onAction(ev.target.dataset.act, ev.target);
  }
});

document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'q') { ui.q = t.value; renderInventory(); }
  if (t.id === 'f-name' && ui.form && !ui.form.picked) {
    const g = guessEmoji(t.value);
    if (g && g !== ui.form.emoji) { ui.form.emoji = g; $('#f-emojis').innerHTML = emojiButtons(); }
  }
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'soon-days') { emit('pantry.set', { soonDays: +t.value }); commit(); }
  if (t.dataset && t.dataset.locName) {
    const l = S.locs.find((x) => x.id === t.dataset.locName);
    const v = t.value.trim();
    if (l && v && v !== l.name) { emit('loc.edit', { id: l.id, name: v }); commit(); } else if (l) t.value = l.name;
  }
});

document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  if (ev.target.id === 'item-form') return saveItem(ev.target);
  if (ev.target.id === 'extra-form') {
    const x = $('#extra');
    const v = x.value.trim();
    if (!v) return;
    x.value = '';
    emit('shop.add', { id: uid(), name: v, emoji: guessEmoji(v) || '🛒' });
    commit();
    $('#extra').focus();
  }
});

$('#file-in').addEventListener('change', async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  if (f.size > 20e6) return toast('That file is too big to be a My Pantry file.');
  try { handleImport(await f.text()); } catch (e) { toast('Couldn’t read that file. Try again.'); }
});

document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
setInterval(() => { if (!document.hidden) render(); }, 60000);

async function boot() {
  document.querySelectorAll('[data-icon]').forEach((el) => { el.outerHTML = icon(el.dataset.icon, el.className); });
  await Store.open();
  const saved = await Store.get('data');
  if (saved && saved.meta && Array.isArray(saved.log)) {
    meta = { ...newMeta(), ...saved.meta };
    log = saved.log.filter(validEvent).sort(order);
    seen = new Set(log.map((e) => e.id));
    rebuild();
  } else {
    meta = newMeta();
  }
  render();
  if (S.pantryId && !meta.persisted) askPersist();
  downloadsCap();
}
boot();
</script>

  // Offline + install support (only on https or localhost).
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Offline support unavailable', e)));
  }
</script>
