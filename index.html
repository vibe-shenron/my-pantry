<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1310" media="(prefers-color-scheme: dark)">
<meta name="description" content="Household inventory: stock by location, prices, an automatic shopping list and expiry warnings.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Pantry">
<meta name="format-detection" content="telephone=no">
<title>My Pantry</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="boot" id="boot"><img src="icons/icon-192.png" alt=""><p class="boot-msg" id="boot-msg" aria-live="polite"></p><span class="boot-bar" aria-hidden="true"><i></i></span></div>

<header class="appbar" id="appbar">
  <div class="appbar-in">
    <span class="appbar-title" id="appbar-title">My Pantry</span>
    <button class="icon-btn press" id="sync-btn" data-act="tab" data-tab="sync" aria-label="Sync"><i data-icon="sync"></i><span class="sdot" id="sdot"></span></button>
  </div>
</header>

<div class="app">
  <section class="screen" id="welcome" hidden></section>

  <section class="screen" id="inventory" hidden>
    <div class="big-head"><p class="eyebrow" id="inv-eyebrow"></p><h1 class="title" id="inv-title">My Pantry</h1></div>
    <div class="hero" id="hero"></div>
    <div id="banners"></div>
    <label class="search"><i data-icon="search"></i><input id="q" type="search" placeholder="Search your pantry" autocomplete="off" enterkeyhint="search" aria-label="Search your pantry"><button type="button" class="icon-btn press" id="q-clear" data-act="q-clear" aria-label="Clear search" hidden><i data-icon="x"></i></button></label>
    <div class="chips" id="chips"></div>
    <div id="groups"></div>
  </section>

  <section class="screen" id="shopping" hidden>
    <div class="big-head"><p class="eyebrow">Filled in from low stock</p><h1 class="title">Shopping</h1></div>
    <div class="hero" id="shop-hero"></div>
    <div class="sec-label"><span>Running low</span><span id="shop-auto-n"></span></div>
    <div class="card" id="shop-auto"></div>
    <div class="sec-label"><span>Extras</span><span id="shop-extra-n"></span></div>
    <div class="card"><div id="shop-extras"></div><form class="add-row" id="extra-form"><span class="check"></span><input id="extra" placeholder="Add something else" autocomplete="off" enterkeyhint="done" maxlength="60" aria-label="Add something to the shopping list"></form></div>
    <div class="dock"><button class="btn primary press" id="restock" data-act="restock" disabled></button></div>
  </section>

  <section class="screen" id="sync" hidden>
    <div class="big-head"><p class="eyebrow">This phone, sharing and backups</p><h1 class="title">Sync &amp; settings</h1></div>
    <div id="sync-body"></div>
  </section>
</div>

<button class="fab away" id="fab" data-act="add" aria-label="Add item"><i data-icon="plus"></i><span>Add item</span></button>

<nav class="nav" id="nav" aria-label="Sections">
  <div class="nav-in">
    <button class="tab active" data-act="tab" data-tab="inventory"><span class="pill"><i data-icon="jar"></i></span>Pantry</button>
    <button class="tab" data-act="tab" data-tab="shopping"><span class="pill"><i data-icon="cart"></i><b class="badge" id="badge-shop" hidden></b></span>Shopping</button>
    <button class="tab" data-act="tab" data-tab="sync"><span class="pill"><i data-icon="sync"></i><b class="badge dot" id="badge-sync" hidden></b></span>Sync</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grabber" aria-hidden="true"></div><div class="sheet-body" id="sheet-body"></div></div>
<div class="dialog-wrap" id="dialog" hidden><div class="dialog" role="alertdialog" aria-modal="true" id="dialog-body"></div></div>
<div class="snack" id="snack" role="status" aria-live="polite"><span id="snack-text"></span><button id="snack-act" hidden></button></div>
<input type="file" id="file-in" accept=".json,application/json,text/plain" hidden>

<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/sheets.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
